<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AMA · 로그인 완료</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #fafafa, #f1f5f9);
    color: #0f172a;
  }
  @media (prefers-color-scheme: dark) {
    body { background: linear-gradient(180deg, #0b0e14, #1e293b); color: #e2e8f0; }
    .card { background: rgba(15,23,42,0.7); border-color: rgba(255,255,255,0.08); }
    .muted { color: #94a3b8; }
    .btn { background: #38bdf8; color: #06121f; }
  }
  .card {
    max-width: 420px; padding: 28px 28px 24px;
    background: rgba(255,255,255,0.85);
    border: 1px solid rgba(15,23,42,0.06);
    backdrop-filter: blur(8px);
    border-radius: 18px;
    box-shadow: 0 12px 40px rgba(15,23,42,0.08);
    text-align: center;
  }
  .logo {
    width: 56px; height: 56px; border-radius: 14px;
    margin: 0 auto 14px;
    background: linear-gradient(135deg, #6366f1, #ec4899);
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 700; font-size: 22px;
    letter-spacing: 0.05em;
  }
  h1 { font-size: 18px; margin: 0 0 6px; font-weight: 600; }
  .muted { font-size: 13.5px; color: #475569; margin: 0 0 20px; line-height: 1.5; }
  .btn {
    display: inline-block; padding: 10px 18px;
    background: #0ea5e9; color: white;
    border-radius: 10px; text-decoration: none; font-size: 13.5px; font-weight: 500;
    border: none; cursor: pointer;
  }
  .btn:hover { filter: brightness(0.95); }
  .hint { font-size: 12px; color: #64748b; margin-top: 14px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">AMA</div>
    <h1>로그인이 완료됐어요</h1>
    <p class="muted">잠시 후 AMA 앱으로 자동 이동합니다.<br>창이 열리지 않으면 아래 버튼을 눌러주세요.</p>
    <a id="open" class="btn" href="#">AMA 앱 열기</a>
    <p class="hint">이 탭은 닫아도 됩니다.</p>
  </div>
<script>
(function () {
  // Supabase는 query 또는 hash 양쪽으로 code/state를 넘길 수 있다.
  var search = window.location.search || '';
  var hash = window.location.hash ? window.location.hash.replace(/^#/, '?') : '';
  // 기본은 search 우선, 없으면 hash 사용
  var query = search || hash || '';
  if (query && query[0] !== '?') query = '?' + query;
  var deepLink = 'ama://auth/callback' + query;

  var btn = document.getElementById('open');
  btn.setAttribute('href', deepLink);

  // 자동 리다이렉트 — 짧은 지연으로 사용자가 메시지를 인지할 시간 확보
  setTimeout(function () {
    try { window.location.replace(deepLink); }
    catch (_) { window.location.href = deepLink; }
  }, 400);
})();
</script>
</body>
</html>
